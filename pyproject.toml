[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "galahad-hackathon-competitor"
version = "0.1.0"
description = "Evidence-first hackathon competition agent for Hermes on Plow"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
include = ["hackathon_competitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
